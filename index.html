
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 탐색 실험</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#182b43;font-family:system-ui,"Noto Sans KR",sans-serif}
main{max-width:1190px;margin:26px auto;padding:0 16px}
h1{font-size:26px}
h2{font-size:21px;margin:0 0 15px}
article{padding:24px;background:#fff;border:1px solid #dbe3ec;border-radius:14px}
p{line-height:1.75}
button{cursor:pointer;padding:10px 15px;border-radius:8px;border:1px solid #b5c5d7;background:white;font:inherit}
button:hover{background:#eef4fc}
button:disabled{opacity:.5;cursor:default}
.primary{background:#285ba6;color:#fff;border-color:#285ba6}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spaced{justify-content:space-between}
.notice{background:#eef5fd;padding:13px;border-radius:9px;margin:15px 0}
.bad{background:#fff0f0;color:#ad3131}
small{color:#64758a}
.graph{overflow-x:auto;border:1px solid #d9e2ee;border-radius:8px;padding:12px}
.cells{display:grid;grid-template-columns:repeat(20,48px);gap:4px;min-width:1036px;align-items:end}
.cell{text-align:center}
.pct{font-size:12px;font-weight:bold}
.axis{height:110px;width:32px;margin:7px auto;display:flex;align-items:end;background:#eaf0f6}
.bar{width:100%;background:#5489c5}
.pick{padding:7px 0;width:46px;font-size:12px}
.picked{background:#dfeaff}
label{display:block;margin:14px 0}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
textarea{width:100%;height:110px;padding:10px;font:inherit}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
</style>
</head>

<body>
<main>
<h1>정보 탐색 실험</h1>
<article id="app"></article>
<p id="state"><small></small></p>
</main>

<script>
'use strict';

// 연결 정보: 기존 파일에서 가져옴
const SUPABASE_URL =
  'https://fesuqweropbeudhnnsop.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_c5bdNtdnE-Xs6TAEtlMzdA_76kwMnhi';

const RESEARCH_EMAIL =
  'stella4324@snu.ac.kr';

const STORAGE_KEY =
  'search_study_full_20261116_v2';

// 확률 단위는 0.1%
// 각 배열의 합계는 1000
const DATA = [
[5,
[98,75,60,39,175,75,81,16,53,24,18,32,54,60,28,20,24,23,22,23],
[24,20,24,16,175,23,39,18,23,60,60,22,75,32,54,98,53,81,75,28]],
[6,
[74,94,57,12,16,195,28,88,18,60,81,21,25,52,24,16,43,44,28,24],
[28,43,18,12,16,195,52,57,24,16,28,21,60,94,88,74,44,25,81,24]],
[7,
[17,25,76,93,59,94,190,72,55,55,43,23,24,45,25,17,20,14,24,29],
[25,20,23,17,24,25,190,14,55,24,43,29,93,59,55,94,45,17,72,76]],
[8,
[54,51,23,59,32,87,73,195,93,61,76,19,25,18,23,15,19,15,42,20],
[18,23,15,25,15,20,19,195,54,19,61,32,59,93,76,42,87,73,51,23]],
[9,
[18,42,55,14,78,19,27,25,185,93,53,83,96,44,21,61,21,31,14,20],
[20,25,21,18,14,21,19,14,185,44,31,42,27,55,96,93,83,53,78,61]],
[12,
[27,13,14,14,29,62,40,97,39,91,18,185,56,21,39,88,94,21,24,28],
[88,62,94,29,91,18,97,40,39,56,21,185,39,27,28,21,14,13,14,24]],
[13,
[24,28,23,31,52,14,51,96,81,41,12,43,175,23,18,95,29,84,57,23],
[18,43,57,96,84,81,95,24,41,23,51,52,175,28,31,23,23,29,12,14]],
[14,
[14,22,18,29,13,18,30,53,23,24,39,29,40,180,73,51,92,98,94,60],
[94,92,60,73,51,98,39,40,29,29,18,53,14,180,18,23,24,30,13,22]],
[15,
[34,23,18,24,20,32,51,13,59,12,74,16,84,60,180,86,32,44,61,77],
[24,86,84,74,77,12,34,18,60,23,61,51,32,59,180,44,13,32,20,16]],
[16,
[20,14,18,20,25,28,14,31,56,48,95,55,32,51,24,180,72,83,61,73],
[95,72,73,83,48,51,55,20,31,32,14,25,61,18,56,180,20,28,24,14]]
];

const stimuli = DATA.flatMap(([peak,a,b],i) => [
  {
    id:`S${i+1}A`,
    pair:i+1,
    condition:'A',
    peak,
    p:a
  },
  {
    id:`S${i+1}B`,
    pair:i+1,
    condition:'B',
    peak,
    p:b
  }
]);

const practice = [
  {
    id:'P1',
    pair:0,
    condition:'practice',
    peak:null,
    p:Array(20).fill(50)
  },
  {
    id:'P2',
    pair:0,
    condition:'practice',
    peak:null,
    p:[
      40,55,45,60,45,35,70,40,55,35,
      60,45,50,55,35,65,45,50,45,70
    ]
  }
];

const app = document.getElementById('app');

let study = null;
let uploading = false;

const uid = () => crypto.randomUUID();

const htmlEscape = x =>
  String(x).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

function save() {
  if(study) {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(study)
    );
  }
}

function show(x) {
  app.innerHTML = x;
}

function status(x) {
  document.getElementById('state').textContent = x;
}

function shuffle(a) {
  for(let i=a.length-1;i>0;i--) {
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function sample(p) {
  let n=Math.floor(Math.random()*1000);

  for(let i=0;i<p.length;i++) {
    n-=p[i];
    if(n<0) return i+1;
  }

  throw Error('확률 합계 오류');
}

function sequence() {
  for(let attempt=0;attempt<10000;attempt++) {
    let A=shuffle(
      stimuli.filter(t=>t.condition==='A').slice()
    );

    let B=shuffle(
      stimuli.filter(t=>t.condition==='B').slice()
    );

    let out=[];

    for(let z=0;z<5;z++) {
      out.push(...shuffle([
        ...A.slice(2*z,2*z+2),
        ...B.slice(2*z,2*z+2)
      ]));
    }

    if(out.some((t,i)=>
      out.slice(Math.max(0,i-2),i)
         .some(v=>v.pair===t.pair)
    )) continue;

    return [...practice,...out].map(t=>({
      ...t,
      target:sample(t.p)
    }));
  }

  throw Error('시행 순서 생성 실패');
}

function addEvent(kind,fields={}) {
  let t=study.trials[study.index];

  study.events.push({
    event_id:uid(),
    session_id:study.id,
    kind,
    trial_no:t
      ?(study.index<2
        ?study.index+1
        :study.index-1)
      :null,
    condition:t?t.condition:null,
    stimulus_id:t?t.id:null,
    peak_position:t?t.peak:null,
    target_position:t?t.target:null,
    click_index:null,
    click_position:null,
    feedback:null,
    invalid_click:null,
    rt_ms:null,
    total_clicks:null,
    probabilities:null,
    survey_text:null,
    ...fields
  });

  save();
}

function consent() {
  show(`
    <h2>연구 참여 안내 및 동의</h2>

    <p>
      본 연구는 확률 정보가 주어진 상황에서
      사람들이 목표를 탐색하는 방식을 알아보는
      <b>실험심리입문 및 실험 수업 과제</b>입니다.
    </p>

    <p>
      만 18세 이상 성인이 참여할 수 있으며,
      연습 2회와 본 실험 20회를 진행합니다.
      예상 소요시간은 약 10분입니다.
    </p>

    <p>
      참여는 자발적이고 언제든 중단할 수 있습니다.
      <b>실험 완료 후 최종 제출한 응답만
      서버에 저장</b>되며, 중도 중단한 응답은
      전송되지 않고 분석에도 사용되지 않습니다.
    </p>

    <p>
      이름·학번·연락처 등 개인식별정보를
      수집하지 않습니다.
      응답은 수업 과제 목적으로만 사용하며
      공개하지 않고 성적 확정 후 삭제합니다.
      호스팅 및 저장 서비스의 기술적 접속 기록은
      각 서비스의 정책을 따릅니다.
    </p>

    <p>연구 문의: ${htmlEscape(RESEARCH_EMAIL)}</p>

    <label>
      <input id="adult" type="checkbox">
      만 18세 이상입니다.
    </label>

    <label>
      <input id="agree" type="checkbox">
      안내를 읽고 자발적으로 참여에 동의합니다.
    </label>

    <button id="begin" class="primary">
      동의하고 시작
    </button>

    <div id="error"></div>
  `);

  document.getElementById('begin').onclick=()=>{
    if(
      !document.getElementById('adult').checked ||
      !document.getElementById('agree').checked
    ) {
      document.getElementById('error').textContent=
        '연령 확인과 동의가 필요합니다.';
      return;
    }

    study={
      id:uid(),
      trials:sequence(),
      index:0,
      clicks:[],
      events:[],
      stage:'instructions',
      trialStart:0,
      lastClick:0,
      survey:''
    };

    addEvent('start');
    save();
    instructions();
  };

  status('동의 전에는 실험 데이터를 생성하지 않습니다.');
}

function instructions() {
  study.stage='instructions';
  save();

  show(`
    <h2>실험 방법</h2>

    <p>
      20개의 위치 중 하나에 목표 카드가 있습니다.
      각 위치의 막대그래프와 숫자는
      그 위치가 정답일 확률입니다.
    </p>

    <p>
      원하는 카드를 누르면 목표 카드가
      <b>왼쪽 또는 오른쪽에 있는지</b>,
      아니면 <b>정답인지</b> 알려줍니다.
      가능한 적은 클릭으로 목표를 찾으세요.
    </p>

    <p>
      연습 2회 이후 본 실험 20회가 진행됩니다.
      시간 제한은 없습니다.
    </p>

    <div class="buttons">
      <button class="primary" id="go">
        연습 시작
      </button>
      <button id="stop">참여 중단</button>
    </div>
  `);

  document.getElementById('go').onclick=()=>{
    study.stage='trial';
    study.trialStart=Date.now();
    study.lastClick=study.trialStart;
    save();
    trial();
  };

  document.getElementById('stop').onclick=withdraw;
}

function trial() {
  if(study.index>=22) {
    survey();
    return;
  }

  study.stage='trial';
  save();

  let t=study.trials[study.index];
  let last=study.clicks.at(-1);
  let done=last?.feedback==='correct';

  let label=study.index<2
    ?`연습 ${study.index+1}/2`
    :`본 실험 ${study.index-1}/20`;

  let response=last
    ?(done
      ?'정답입니다.'
      :last.feedback==='right'
        ?'목표 카드는 선택한 위치보다 오른쪽에 있습니다.'
        :'목표 카드는 선택한 위치보다 왼쪽에 있습니다.')
    :'원하는 위치를 클릭하세요.';

  show(`
    <div class="row spaced">
      <h2>${label}</h2>
      <b>목표 카드의 위치를 찾으세요</b>
    </div>

    <p>
      <small>
        모든 막대는 같은 0~20% 척도입니다.
        작은 화면에서는 좌우로 스크롤할 수 있습니다.
      </small>
    </p>

    <div class="graph">
      <div class="cells" id="cells"></div>
    </div>

    <p class="notice" id="feedback">${response}</p>

    <div class="buttons">
      <button class="primary" id="next">
        다음 시행
      </button>
      <button id="stop">참여 중단</button>
    </div>
  `);

  let cells=document.getElementById('cells');

  t.p.forEach((p,i)=>{
    let node=document.createElement('div');
    node.className='cell';

    node.innerHTML=`
      <div class="pct">${(p/10).toFixed(1)}%</div>
      <div class="axis">
        <div class="bar"
          style="height:${p/200*100}%">
        </div>
      </div>
      <div>${i+1}번</div>
    `;

    let b=document.createElement('button');

    b.className='pick'+(
      study.clicks.some(c=>c.position===i+1)
        ?' picked'
        :''
    );

    b.textContent='확인';
    b.disabled=!!done;
    b.onclick=()=>click(i+1);

    node.appendChild(b);
    cells.appendChild(node);
  });

  let next=document.getElementById('next');
  next.hidden=!done;

  next.onclick=()=>{
    if(
      !study.clicks.at(-1) ||
      study.clicks.at(-1).feedback!=='correct'
    ) return;

    study.index++;
    study.clicks=[];
    study.trialStart=Date.now();
    study.lastClick=study.trialStart;

    save();
    trial();
  };

  document.getElementById('stop').onclick=withdraw;

  status(
    '응답은 최종 제출 전까지 브라우저에만 임시 보관됩니다.'
  );
}

function click(position) {
  if(
    study.stage!=='trial' ||
    study.clicks.at(-1)?.feedback==='correct'
  ) return;

  let t=study.trials[study.index];
  let now=Date.now();
  let lo=1;
  let hi=20;

  for(let c of study.clicks) {
    if(c.feedback==='right') {
      lo=Math.max(lo,c.position+1);
    }

    if(c.feedback==='left') {
      hi=Math.min(hi,c.position-1);
    }
  }

  let feedback=position===t.target
    ?'correct'
    :position<t.target
      ?'right'
      :'left';

  let item={
    position,
    feedback,
    invalid:position<lo||position>hi
  };

  study.clicks.push(item);

  addEvent('click',{
    click_index:study.clicks.length,
    click_position:position,
    feedback,
    invalid_click:item.invalid,
    rt_ms:now-study.lastClick,
    probabilities:t.p
  });

  if(feedback==='correct') {
    addEvent('trial_done',{
      total_clicks:study.clicks.length,
      rt_ms:now-study.trialStart
    });
  }

  study.lastClick=now;
  save();
  trial();
}

function survey() {
  study.stage='survey';
  save();

  show(`
    <h2>실험 완료</h2>

    <p>
      위치를 선택할 때 주로 어떤 기준으로
      판단했나요? (선택 사항)
    </p>

    <textarea
      id="strategy"
      maxlength="1200"
    ></textarea>

    <div class="buttons">
      <button class="primary" id="submit">
        최종 응답 제출
      </button>

      <button id="stop">
        제출하지 않고 중단
      </button>
    </div>
  `);

  document.getElementById('strategy').value=
    study.survey||'';

  document.getElementById('submit').onclick=()=>{
    study.survey=
      document.getElementById('strategy').value;

    addEvent('survey',{
      survey_text:study.survey
    });

    study.stage='submitting';
    save();
    submit();
  };

  document.getElementById('stop').onclick=withdraw;
}

function withdraw() {
  if(uploading) return;

  if(!confirm(
    '참여를 중단하고 제출하지 않은 응답을 삭제할까요?'
  )) return;

  localStorage.removeItem(STORAGE_KEY);
  study=null;

  show(`
    <h2>참여 중단</h2>
    <p>응답을 서버에 제출하지 않았습니다.</p>
  `);

  status('');
}

async function submit() {
  if(
    uploading ||
    !study ||
    study.stage!=='submitting'
  ) return;

  uploading=true;

  show(`
    <h2>응답 저장 중</h2>
    <p>창을 닫지 마세요.</p>
    <div id="saveError"></div>
  `);

  try {
    const endpoint=new URL(
      '/rest/v1/rpc/save_psychology_session',
      SUPABASE_URL
    ).href;

    const resp=await fetch(endpoint,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_PUBLISHABLE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({
        p_events:study.events
      })
    });

    if(!resp.ok) {
      throw Error(
        'HTTP '+resp.status+': '+
        (await resp.text()).slice(0,300)
      );
    }

    localStorage.removeItem(STORAGE_KEY);
    study=null;

    show(`
      <h2>제출 완료</h2>
      <p>
        응답이 정상적으로 저장되었습니다.
        참여해 주셔서 감사합니다.
      </p>
    `);

    status('저장 완료');

  } catch(e) {
    document.getElementById('saveError').innerHTML=`
      <p class="notice bad" id="err"></p>
      <button id="retry">저장 재시도</button>
    `;

    document.getElementById('err').textContent=
      String(e.message||e);

    document.getElementById('retry').onclick=submit;

    status(
      '서버에 저장하지 못했습니다. '+
      '브라우저에 응답이 남아 있습니다.'
    );

  } finally {
    uploading=false;
  }
}

function init() {
  for(let t of [...stimuli,...practice]) {
    if(
      t.p.length!==20 ||
      t.p.reduce((a,b)=>a+b,0)!==1000
    ) {
      throw Error(t.id+' 확률 합계 오류');
    }
  }

  try {
    study=JSON.parse(
      localStorage.getItem(STORAGE_KEY)||'null'
    );
  } catch(_) {
    study=null;
  }

  if(!study) {
    consent();
    return;
  }

  if(study.stage==='instructions') {
    instructions();

  } else if(study.stage==='trial') {
    trial();

  } else if(study.stage==='survey') {
    survey();

  } else if(study.stage==='submitting') {
    show(`
      <h2>미제출 응답이 있습니다</h2>
      <p>저장 재시도 버튼을 눌러 주세요.</p>
      <button class="primary" id="retry">
        저장 재시도
      </button>
    `);

    document.getElementById('retry').onclick=submit;

  } else {
    consent();
  }
}

init();
</script>
</body>
</html>
