<!doctype html>
<html lang="ko">
<head>

<style>

  font-family: system-ui, "Noto Sans KR", sans-serif;

  background: #f4f7fb;
}
* { box-sizing: border-box; }

.wrap {

}
h1 {

}
.box {
  background: white;
  border: 1px solid #dfe6ef;

}
p { line-height: 1.7; }

button {

  font: inherit;

.main {
  background: #285aab;
  color: white;

.stop { color: #a23f3f; }
.hidden { display: none !important; }

.note {
  color: #5d6e83;

}
.status {
  margin-top: 12px;
  color: #526782;
  font-size: 14px;
}

  color: #ad2525;

}
.row {

.target {
  font-weight: bold;

}

  border-radius: 9px;

}
.bars {

  grid-template-columns: repeat(20, 50px);
  gap: 3px;

}

.percent {

}

  width: 35px;

}
.bar {
  width: 35px;
  background: #548bc6;
}
.label {
  font-size: 12px;
  margin: 6px 0;
}
.pick {
  padding: 7px;
  font-size: 12px;
}
.picked { background: #dce9fb; }

.feedback {
  padding: 14px;
  background: #edf4fb;
  border-radius: 8px;
  margin: 16px 0;
  min-height: 48px;
  font-weight: 650;
}
.btns {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
label {
  display: block;
  margin: 10px 0;
}
textarea {
  width: 100%;
  height: 90px;
  padding: 10px;
}
h2 {
  font-size: 19px;
  margin: 0 0 14px;
}
</style>
</head>

<script>

/* ======================================

/* ======================================

const DATA = [

/* ======================================
   실험 설정
====================================== */

const STIMULI = DATA.flatMap(
  ([peak,a,b],i) => [
    {
      id: `S${i+1}A`,
      pair: i+1,
      condition: 'A',
      peak,
      p: a
    },
    {
      id: `S${i+1}B`,
      pair: i+1,
      condition: 'B',
      peak,
      p: b
    }
  ]
);

const PRACTICE = [
  {
    id: 'P1',
    condition: 'practice',
    peak: null,
    p: Array(20).fill(50)
  },
  {
    id: 'P2',
    condition: 'practice',
    peak: null,
    p: [
      40,55,45,60,45,35,70,40,55,35,
      60,45,50,55,35,65,45,50,45,70
    ]
  }
];

const KEY = 'search_experiment_2026_v1';

const screen = document.getElementById('screen');
const status = document.getElementById('status');
const retryButton = document.getElementById('retry');

let S = null;
let Q = [];
let sending = false;
let saveError = '';

const uuid = () => crypto.randomUUID();

function shuffle(a) {
  for (let i=a.length-1; i>0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function sample(p) {
  let x = Math.floor(Math.random()*1000);
  let s = 0;

  for (let i=0; i<p.length; i++) {
    s += p[i];
    if (x<s) return i+1;
  }

  throw Error('확률 합계 오류');
}

function plan() {
  for (let attempt=0; attempt<10000; attempt++) {
    let a = shuffle(
      STIMULI.filter(x=>x.condition==='A').slice()
    );

    let b = shuffle(
      STIMULI.filter(x=>x.condition==='B').slice()
    );

    let out = [];

    for (let j=0; j<5; j++) {
      out.push(...shuffle([
        ...a.slice(j*2,j*2+2),
        ...b.slice(j*2,j*2+2)
      ]));
    }

    let seen = {};
    let ok = true;

    for (let i=0; i<out.length; i++) {
      if (
        seen[out[i].pair]!==undefined &&
        i-seen[out[i].pair]<3
      ) {
        ok = false;
        break;
      }
      seen[out[i].pair]=i;
    }

    if (ok) {
      return [...PRACTICE,...out].map(x=>({
        ...x,
        target: sample(x.p),
        number: 100+Math.floor(Math.random()*800)
      }));
    }
  }

  throw Error('시행 순서 생성 오류');
}

function save() {
  localStorage.setItem(
    KEY,
    JSON.stringify({S,Q})
  );
  setStatus();
}

function setStatus() {
  status.textContent = saveError
    ? `저장 오류: ${saveError} (저장 재시도 필요)`
    : Q.length
      ? `응답 ${Q.length}건 전송 중. 완료 후 종료해 주세요.`
      : '저장 상태: 정상';

  retryButton.classList.toggle(
    'hidden',
    !saveError
  );
}

function event(kind,extra={}) {
  return {
    event_id: uuid(),
    session_id: S.id,
    kind,
    trial_no: S.i<22 ? S.i+1 : null,
    condition: S.i<22
      ? S.trials[S.i].condition
      : null,
    stimulus_id: S.i<22
      ? S.trials[S.i].id
      : null,
    peak_position: S.i<22
      ? S.trials[S.i].peak
      : null,
    target_position: S.i<22
      ? S.trials[S.i].target
      : null,
    ...extra
  };
}

function enqueue(e) {
  Q.push(e);
  save();
  void flush();
}

async function flush() {
  if (sending || saveError) return;

  sending = true;

  while (Q.length && !saveError) {
    let e = Q[0];

    try {
      let r = await fetch(
        SUPABASE_URL.replace(/\/$/,'') +
        '/rest/v1/experiment_events',
        {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(e)
        }
      );

      if (!r.ok) {
        let t = await r.text();

        if (
          r.status!==409 ||
          !t.includes('23505')
        ) {
          throw Error(
            `HTTP ${r.status}: ${t.slice(0,180)}`
          );
        }
      }

      Q.shift();
      save();

    } catch(x) {
      saveError = x.message;
      setStatus();
    }
  }

  sending = false;
  setStatus();
}

async function drain() {
  while (sending) {
    await new Promise(
      r=>setTimeout(r,80)
    );
  }

  return !saveError && !Q.length;
}

function retry() {
  saveError = '';
  setStatus();
  void flush();
}

function show(html) {
  screen.innerHTML = html;
}

/* ======================================
   연구 참여 안내
====================================== */

function consent() {
  show(`
    <h2>연구 참여 안내 및 동의</h2>

    <p>
      본 연구는 확률 정보가 주어진 상황에서의
      정보 탐색 행동을 살펴보는
      <b>실험심리입문 및 실험 수업 과제</b>입니다.

    </p>

    <p>

      사이트 제공·저장 서비스의 기술적 접속 로그는
      별도 정책에 따릅니다.
    </p>

    <p>문의: ${RESEARCH_EMAIL}</p>

    <label>
      <input id="adult" type="checkbox">
      만 18세 이상입니다.
    </label>

    <label>
      <input id="agree" type="checkbox">
      안내를 읽고 연구 참여에 동의합니다.
    </label>

    <button class="main" onclick="start()">
      동의하고 시작
    </button>

    <p id="msg" class="err"></p>
  `);
}

async function start() {
  if (
    !document.getElementById('adult').checked ||
    !document.getElementById('agree').checked
  ) {
    document.getElementById('msg').textContent =
      '연령 확인과 동의가 필요합니다.';
    return;
  }

  if (
    SUPABASE_URL.includes('YOUR_PROJECT') ||
    SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_ME') ||
    RESEARCH_EMAIL.startsWith('연구자')
  ) {
    document.getElementById('msg').textContent =
      '코드 상단의 저장 정보와 연구자 이메일을 수정해 주세요.';
    return;
  }

  S = {
    id: uuid(),
    i: 0,
    trials: plan(),
    clicks: [],
    done: false,
    startedAt: Date.now(),
    trialStart: 0,
    stage: 'instructions'
  };

  Q = [];
  saveError = '';
  save();

  enqueue(event('start'));
  await drain();

  if (saveError) {
    show(`
      <p class="err">
        데이터 저장 연결에 실패했습니다.
        저장 재시도 버튼을 눌러 주세요.
        저장이 정상화되면 새로고침하고
        이어서 진행할 수 있습니다.
      </p>
    `);
    return;
  }

  instructions();
}

function instructions() {
  S.stage = 'instructions';
  save();

  show(`
    <h2>실험 방법</h2>

    <p>
      20개의 카드는 왼쪽부터 오른쪽으로
      숫자가 증가하도록 정렬되어 있습니다.
      목표 숫자는 반드시 카드 하나에 있습니다.
    </p>

    <p>
      각 위치 위의 막대와 숫자는
      목표 숫자가 그 위치에 있을 확률입니다.

    </p>

    <p>

      큰지 또는 같은지 알려줍니다.
      정답을 찾을 때까지 선택하세요.
    </p>

    <p>
      가능한 한 <b>적은 횟수</b>로
      정답을 찾으세요.
      연습 2회 뒤 본 실험 20회가 시작됩니다.
    </p>

    <div class="btns">
      <button class="main" onclick="begin()">
        실험 시작 / 이어서 진행
      </button>

      <button class="stop" onclick="withdraw()">
        참여 중단
      </button>
    </div>
  `);
}

function begin() {
  S.stage = 'trial';

  if (!S.trialStart) {
    S.trialStart = Date.now();
  }

  save();
  draw();
}

/* ======================================
   실험 화면
====================================== */

function draw() {
  if (!S) return;

  if (S.i>=22) {
    survey();
    return;
  }

  S.stage = 'trial';

  let t = S.trials[S.i];

  let m = S.i<2
    ? `연습 ${S.i+1}/2`
    : `본 실험 ${S.i-1}/20`;

  let last = S.clicks.at(-1);

  let fb = !last
    ? '원하는 위치부터 확인하세요.'
    : last.feedback==='correct'
      ? '정답입니다.'
      : last.feedback==='right'
        ? '선택한 카드보다 오른쪽에 목표 숫자가 있습니다.'
        : '선택한 카드보다 왼쪽에 목표 숫자가 있습니다.';

  show(`
    <div class="row">
      <h2>${m}</h2>
      <span class="target">
        목표 숫자: ${t.number}
      </span>
    </div>

    <p class="note">
      20개 위치의 사전확률
      (각 막대는 0~20% 기준, 좌우 스크롤 가능)
    </p>

    <div class="scroll">
      <div class="bars" id="bars"></div>
    </div>

    <div class="feedback" id="feedback">
      ${fb}
    </div>

    <div class="btns">
      <button
        class="main ${S.done?'':'hidden'}"
        id="next"
        onclick="next()"
      >
        다음 시행
      </button>

      <button class="stop" onclick="withdraw()">
        참여 중단
      </button>
    </div>
  `);

  let bars = document.getElementById('bars');

  t.p.forEach((u,i)=>{
    let div = document.createElement('div');
    div.className = 'slot';

    div.innerHTML = `
      <div class="percent">
        ${(u/10).toFixed(1)}%
      </div>

      <div class="axis">
        <div
          class="bar"
          style="height:${u/200*115}px"
        ></div>
      </div>

      <div class="label">
        ${i+1}번
      </div>
    `;

    let b = document.createElement('button');

    b.className =
      'pick' +
      (S.clicks.some(x=>x.position===i+1)
        ? ' picked'
        : '');

    b.textContent = '확인';
    b.disabled = S.done;

    b.addEventListener(
      'click',
      ()=>click(i+1)
    );

    div.appendChild(b);
    bars.appendChild(div);
  });

  save();
}

function click(k) {
  if (!S || S.done) return;

  let t = S.trials[S.i];

  let lo = 1;
  let hi = 20;

  for (let c of S.clicks) {
    if (c.position<t.target) {
      lo = Math.max(lo,c.position+1);
    }

    if (c.position>t.target) {
      hi = Math.min(hi,c.position-1);
    }
  }

  let invalid = k<lo || k>hi;

  let feedback =
    k===t.target
      ? 'correct'
      : k<t.target
        ? 'right'
        : 'left';

  let rec = {
    position: k,
    feedback,
    invalid,
    rt_ms: Date.now()-S.trialStart,
    click_index: S.clicks.length+1
  };

  S.clicks.push(rec);

  enqueue(
    event('click',{
      click_index: rec.click_index,
      click_position: k,
      feedback,
      invalid_click: invalid,
      rt_ms: rec.rt_ms,
      probabilities: t.p
    })
  );

  if (k===t.target) {
    S.done = true;

    enqueue(
      event('trial_done',{
        total_clicks: S.clicks.length
      })
    );
  }

  draw();
}

function next() {
  if (!S.done) return;

  S.i++;
  S.done = false;
  S.clicks = [];
  S.trialStart = Date.now();

  save();
  draw();
}

/* ======================================
   종료 및 중단
====================================== */

function survey() {
  S.stage = 'survey';
  save();

  show(`
    <h2>실험 완료</h2>

    <p>
      카드 위치를 선택할 때 주로
      어떤 기준으로 판단했나요?
      (선택 사항)
    </p>

    <textarea
      id="answer"
      maxlength="1200"
    ></textarea>

    <div class="btns">
      <button class="main" onclick="finish()">
        응답 제출
      </button>
    </div>
  `);
}

async function finish() {
  if (!S) return;

  enqueue(
    event('survey',{
      survey_text:
        document.getElementById('answer')?.value || ''
    })
  );

  show(`
    <h2>응답 저장 중</h2>
    <p>
      저장이 완료되면 종료됩니다.
      페이지를 닫지 마세요.
    </p>
  `);

  await drain();

  if (saveError) {
    show(`
      <p class="err">
        저장 오류입니다.
        저장 재시도 버튼을 눌러 주세요.
        저장 상태가 정상이 되면
        새로고침한 뒤 제출을 완료하세요.
      </p>
    `);
    return;
  }

  localStorage.removeItem(KEY);
  S = null;

  show(`
    <h2>참여 완료</h2>
    <p>
      응답이 모두 저장되었습니다.
      감사합니다.
    </p>
  `);
}

async function withdraw() {
  if (!S) return;

  enqueue(
    event('withdraw',{
      total_clicks: S.clicks.length
    })
  );

  show(`
    <h2>참여 중단</h2>
    <p>
      지금까지의 기록을 저장 중입니다.
    </p>
  `);

  await drain();

  if (saveError) {
    show(`
      <p class="err">
        저장 오류입니다.
        저장 재시도 버튼을 눌러 주세요.
      </p>
    `);
    return;
  }

  localStorage.removeItem(KEY);
  S = null;

  show(`
    <h2>참여 중단 완료</h2>
    <p>
      이전까지 전송된 응답은
      수업 과제 분석에 사용될 수 있습니다.
    </p>
  `);
}

/* ======================================
   초기 실행
====================================== */

/* ===== 수정 시작: 완료 후 제출 / 숫자 표시 제거 ===== */

// 실험 도중에는 브라우저에만 기록합니다.
enqueue = function (e) {
  Q.push(e);
  save();
};

// 기존 실험 시작 함수가 서버 응답을 기다리지 않도록 합니다.
drain = async function () {
  return true;
};

setStatus = function () {
  status.textContent = saveError
    ? '제출 오류: ' + saveError
    : S && S.stage === 'submitting'
      ? '완료된 응답을 Supabase로 저장 중입니다.'
      : S
        ? '응답은 최종 제출 전까지 브라우저에만 임시 저장됩니다.'
        : '실험 시작 전';

  retryButton.classList.toggle('hidden', !saveError);
};

// 모든 시행을 마친 경우에만 전체 자료를 한 번에 전송합니다.
flush = async function () {
  if (!S || S.stage !== 'submitting' || Q.length === 0) {
    return true;
  }

  if (sending) {
    while (sending) {
      await new Promise(r => setTimeout(r, 80));
    }
    return !saveError && Q.length === 0;
  }

  sending = true;
  saveError = '';
  setStatus();

  try {
    const endpoint = new URL(
      '/rest/v1/experiment_events?on_conflict=event_id',
      SUPABASE_URL
    );

    const response = await fetch(endpoint.href, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=ignore-duplicates,return=minimal'
      },
      body: JSON.stringify(Q.map(e => ({
  event_id: e.event_id,
  session_id: e.session_id,
  kind: e.kind,
  trial_no: e.trial_no ?? null,
  condition: e.condition ?? null,
  stimulus_id: e.stimulus_id ?? null,
  peak_position: e.peak_position ?? null,
  target_position: e.target_position ?? null,
  click_index: e.click_index ?? null,
  click_position: e.click_position ?? null,
  feedback: e.feedback ?? null,
  invalid_click: e.invalid_click ?? null,
  rt_ms: e.rt_ms ?? null,
  total_clicks: e.total_clicks ?? null,
  probabilities: e.probabilities ?? null,
  survey_text: e.survey_text ?? null
})))
    });

    if (!response.ok) {
      const body = await response.text();
      throw new Error(
        'HTTP ' + response.status + ': ' + body.slice(0, 180)
      );
    }

    Q = [];
    save();
    return true;

  } catch (e) {
    saveError = String(e.message || e);
    return false;

  } finally {
    sending = false;
    setStatus();
  }
};

// 최종 제출 및 제출 실패 시 재시도
async function submitAll() {
  if (!S || S.stage !== 'submitting') return;

  show(`
    <h2>응답 제출 중</h2>
    <p>전체 자료를 저장하고 있습니다.</p>
    <p>저장이 완료될 때까지 이 화면을 닫지 마세요.</p>
  `);

  const ok = await flush();

  if (!ok) {
    show(`
      <h2>제출 실패</h2>
      <p class="err">
        응답은 이 브라우저에 남아 있습니다.
        위의 저장 재시도 버튼을 눌러 주세요.
      </p>
    `);
    return;
  }

  localStorage.removeItem(KEY);
  S = null;
  Q = [];
  saveError = '';
  setStatus();

  show(`
    <h2>참여 완료</h2>
    <p>전체 응답이 정상적으로 저장되었습니다.</p>
    <p>실험에 참여해 주셔서 감사합니다.</p>
  `);
}

retry = function () {
  saveError = '';
  setStatus();
  void submitAll();
};

// 마지막 응답 제출 버튼
finish = async function () {
  if (!S || S.stage !== 'survey') return;

  const answer =
    document.getElementById('answer')?.value || '';

  enqueue(event('survey', {
    survey_text: answer
  }));

  S.stage = 'submitting';
  save();

  await submitAll();
};

// 중도 중단: 서버 전송 없이 임시 기록 삭제
withdraw = async function () {
  if (!S) return;

  const confirmed = confirm(
    '참여를 중단하면 지금까지의 실험 응답을 ' +
    '제출하지 않고 삭제합니다. 중단할까요?'
  );

  if (!confirmed) return;

  localStorage.removeItem(KEY);

  Q = [];
  S = null;
  saveError = '';
  setStatus();

  show(`
    <h2>참여 중단</h2>
    <p>실험 응답을 서버에 전송하지 않았습니다.</p>
  `);
};

// 연구 참여 안내문 수정
const previousConsent = consent;

consent = function () {
  previousConsent();

  for (const p of screen.querySelectorAll('p')) {
    if (p.textContent.includes('중단 이전에 전송된 응답')) {
      p.textContent =
        '참여는 자발적이며 언제든 중단할 수 있습니다. ' +
        '실험을 완료하고 최종 제출 버튼을 누른 경우에만 ' +
        '응답을 연구 데이터베이스에 저장합니다. ' +
        '중도 중단 시 응답은 제출되지 않고 ' +
        '분석에도 사용되지 않습니다.';
    }
  }
};

// 실험 방법 안내 수정
const previousInstructions = instructions;

instructions = function () {

  // 제출 중 새로고침해도 다시 저장할 수 있도록 처리
  if (S && S.stage === 'submitting') {
    void submitAll();
    return;
  }

  previousInstructions();

  for (const p of screen.querySelectorAll('p')) {

    if (p.textContent.includes('20개의 카드는 왼쪽부터')) {

      p.textContent =
        '1번부터 20번까지의 카드 중 하나가 목표 카드입니다. ' +
        '목표 카드의 위치를 찾아주세요.';

    } else if (
      p.textContent.includes('각 위치 위의 막대와 숫자는')
    ) {

      p.textContent =
        '각 막대와 숫자는 목표 카드가 그 위치에 있을 ' +
        '확률입니다. 원하는 위치를 클릭해 확인하세요.';

    } else if (
      p.textContent.includes('선택한 카드의 숫자가')
    ) {

      p.textContent =
        '클릭할 때마다 목표 카드가 그 위치보다 ' +
        '왼쪽인지, 오른쪽인지, 또는 바로 그 위치인지 ' +
        '알려줍니다.';
    }
  }
};

// 실험 화면에서 의미 없는 임의 숫자를 제거
const previousDraw = draw;

draw = function () {
  previousDraw();

  screen.querySelector('.target')?.remove();

  const feedback = screen.querySelector('#feedback');

  if (feedback) {
    feedback.textContent =
      feedback.textContent.replace(
        /목표 숫자/g,
        '목표 카드'
      );
  }
};

/* ===== 수정 끝 ===== */  
  
(function init() {
  for (let i=0; i<STIMULI.length; i++) {
    if (
      STIMULI[i].p.length!==20 ||
      STIMULI[i].p.reduce((a,b)=>a+b,0)!==1000
    ) {
      throw Error('실험 자극 오류');
    }
  }

  let old = localStorage.getItem(KEY);

  if (old) {
    try {
      let x = JSON.parse(old);

      S = x.S;
      Q = x.Q || [];

      if (S) {
        if (Q.length) {
          void flush();
        }

        if (S.stage==='trial') {
          draw();
        } else if (S.stage==='survey') {
          survey();
        } else {
          instructions();
        }

        return;
      }
    } catch(e) {
      console.error(e);
    }
  }

  consent();
})();

</script>
