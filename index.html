
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 탐색 실험</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#1d2939;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1250px;margin:25px auto;padding:0 18px}
h1{font-size:25px;margin:0 0 15px}
h2{font-size:20px;margin:0 0 15px}
p{line-height:1.7;margin:10px 0}
section{background:white;border:1px solid #dfe4ed;border-radius:13px;padding:25px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #afbccb;background:white;color:#26394d;padding:10px 14px}
button:hover{background:#eef4fc}
button:disabled{opacity:.5;cursor:default}
.primary{background:#285aa5;color:#fff;border-color:#285aa5}
.primary:hover{background:#234e91}
.stop{border-color:#dc9999;color:#9f3434}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:#586b80;font-size:14px}
.notice{padding:12px 14px;border-radius:9px;background:#edf4fc;margin:16px 0}
.error{background:#fff1f1;color:#a72f2f}
.success{background:#e8f5eb;color:#21572e}
.scroll{overflow-x:auto;border:1px solid #dde5ee;border-radius:10px;padding:15px 9px}
.bargrid{display:grid;grid-template-columns:repeat(20,48px);gap:4px;min-width:1036px;align-items:end}
.cell{text-align:center}
.pct{font-size:12px;font-weight:650}
.barbox{height:125px;width:33px;margin:6px auto;display:flex;align-items:end;background:#eaf0f7}
.bar{width:100%;background:#4e87c1}
.pos{margin:7px 0;font-size:12px}
.pick{width:45px;padding:7px 1px;font-size:12px}
.used{background:#e8edf8}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
textarea{font:inherit;padding:12px;width:100%;min-height:92px;border-radius:8px;border:1px solid #b9c3d2}
label{display:block;padding:7px 0}
input[type=checkbox]{transform:scale(1.1);margin-right:8px}
.hidden{display:none}
.meta{margin-top:12px;font-size:13px;color:#66788a}
@media(max-width:650px){section{padding:16px}}
</style>
</head>
<body>
<main>
<h1>정보 탐색 실험</h1>
<section id="app"></section>
<div id="state" class="meta"></div>
</main>

<script>
'use strict';

// =============================================

// =============================================

// 확률 단위: 0.1%. 각 배열 합계 = 1000.
const DATA = [

[8,

[12,
[27,13,14,14,29,62,40,97,39,91,18,185,56,21,39,88,94,21,24,28],
[88,62,94,29,91,18,97,40,39,56,21,185,39,27,28,21,14,13,14,24]],
[13,
[24,28,23,31,52,14,51,96,81,41,12,43,175,23,18,95,29,84,57,23],
[18,43,57,96,84,81,95,24,41,23,51,52,175,28,31,23,23,29,12,14]],
[14,
[14,22,18,29,13,18,30,53,23,24,39,29,40,180,73,51,92,98,94,60],
[94,92,60,73,51,98,39,40,29,29,18,53,14,180,18,23,24,30,13,22]],
[15,

[24,86,84,74,77,12,34,18,60,23,61,51,32,59,180,44,13,32,20,16]],
[16,
[20,14,18,20,25,28,14,31,56,48,95,55,32,51,24,180,72,83,61,73],
[95,72,73,83,48,51,55,20,31,32,14,25,61,18,56,180,20,28,24,14]]

const PRACTICE = [
  {
    id:'P1',pair:0,condition:'practice',
    peak:null,p:Array(20).fill(50)
  },
  {
    id:'P2',pair:0,condition:'practice',
    peak:null,
    p:[40,55,45,60,45,35,70,40,55,35,
       60,45,50,55,35,65,45,50,45,70]
  }
];

const STIMULI = DATA.flatMap(([peak,a,b],i)=>[
  {id:`S${i+1}A`,pair:i+1,condition:'A',peak,p:a},
  {id:`S${i+1}B`,pair:i+1,condition:'B',peak,p:b}
]);

const STORAGE_KEY =
  'experimental_psychology_final_20261116_v1';

const app = document.getElementById('app');
const stateText = document.getElementById('state');

let study = null;
let uploading = false;

const uid = () => crypto.randomUUID();

const escapeHtml = s =>
  String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

function validate() {
  if (STIMULI.length !== 20)
    throw Error('본 실험 자극 수 오류');

  for (const t of [...PRACTICE,...STIMULI]) {
    if (
      t.p.length !== 20 ||
      t.p.some(x=>!Number.isInteger(x)||x<0) ||
      t.p.reduce((a,b)=>a+b,0) !== 1000
    ) throw Error(t.id+' 확률 오류');
  }

  for (let i=0;i<10;i++) {
    const a=STIMULI[2*i], b=STIMULI[2*i+1];
    if (
      a.peak !== b.peak ||
      a.p.slice().sort((x,y)=>x-y).join(',') !==
      b.p.slice().sort((x,y)=>x-y).join(',')
    ) throw Error('짝 자극 오류 '+i);
  }
}

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function weightedPosition(p) {
  const x=Math.floor(Math.random()*1000);
  let s=0;
  for(let i=0;i<20;i++) {
    s+=p[i];
    if(x<s) return i+1;
  }
  throw Error('정답 추출 오류');
}

function makeOrder() {
  for(let attempts=0;attempts<20000;attempts++) {
    const a=shuffle(
      STIMULI.filter(t=>t.condition==='A').slice()
    );
    const b=shuffle(
      STIMULI.filter(t=>t.condition==='B').slice()
    );
    const out=[];

    for(let block=0;block<5;block++) {
      out.push(...shuffle([
        ...a.slice(2*block,2*block+2),
        ...b.slice(2*block,2*block+2)
      ]));
    }

    const seen={};
    let valid=true;

    for(let j=0;j<out.length;j++) {
      if(
        seen[out[j].pair]!==undefined &&
        j-seen[out[j].pair]<3
      ) {
        valid=false;
        break;
      }
      seen[out[j].pair]=j;
    }

    if(valid) {
      return [...PRACTICE,...out].map(t=>({
        ...t,target:weightedPosition(t.p)
      }));
    }
  }
  throw Error('시행 순서 오류');
}

function persist() {
  if(study)
    localStorage.setItem(
      STORAGE_KEY,JSON.stringify(study)
    );
}

function clearStudy() {
  localStorage.removeItem(STORAGE_KEY);
  study=null;
}

function display(html) {
  app.innerHTML=html;
}

function state(message) {
  stateText.textContent=message||'';
}

function checkSettings() {
  if(
    !SUPABASE_URL.startsWith('https://') ||
    SUPABASE_URL.includes('YOUR_PROJECT') ||
    SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_ME')
  ) return '기존 Supabase URL과 공개키를 입력해야 합니다.';

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(RESEARCH_EMAIL)
  ) return '연구자 이메일을 실제 주소로 바꿔 주세요.';

  return null;
}

function landing() {
  display(`
    <h2>연구 참여 안내 및 동의</h2>

    <p>
      본 연구는 확률 정보가 주어진 상황에서
      사람들이 목표를 탐색하는 방식을 알아보기 위한
      <b>실험심리입문 및 실험 수업 과제</b>입니다.
    </p>

    <p>
      만 18세 이상 성인이 참여할 수 있습니다.
      연습 2회와 본 실험 20회를 진행하며,
      예상 소요시간은
      ${escapeHtml(ESTIMATED_MINUTES)}입니다.
    </p>

    <p>
      참여는 자발적이며 언제든 중단할 수 있습니다.
      <b>완료 후 '응답 제출'을 눌렀을 때만</b>
      연구 응답을 전송합니다.
      중도 중단 시 응답은 전송하지 않고
      분석에도 사용하지 않습니다.
    </p>

    <p>
      이름, 학번, 연락처 등 개인식별 정보를
      수집하지 않습니다.
      응답은 수업 과제 목적으로만 사용하고
      공개하지 않으며, 성적 확정 후 삭제합니다.
      웹 호스팅 및 저장 서비스의 기술적 접속 기록은
      각 서비스의 정책을 따릅니다.
    </p>

    <p>
      연구 문의: ${escapeHtml(RESEARCH_EMAIL)}
    </p>

    <label>
      <input type="checkbox" id="adult">
      만 18세 이상입니다.
    </label>

    <label>
      <input type="checkbox" id="consent">
      위 안내를 읽고 자발적으로 참여에 동의합니다.
    </label>

    <div class="controls">
      <button class="primary" id="beginConsent">
        동의하고 시작
      </button>
    </div>

    <p id="warning" class="error hidden notice"></p>
  `);

  document.getElementById('beginConsent').onclick=()=>{
    if(
      !document.getElementById('adult').checked ||
      !document.getElementById('consent').checked
    ) {
      warn('연령 확인 및 동의가 필요합니다.');
      return;
    }

    const err=checkSettings();
    if(err){warn(err);return;}

    study={
      id:uid(),
      trials:makeOrder(),
      i:0,
      clicks:[],
      events:[],
      trialStarted:0,
      previousClick:0,
      stage:'instructions',
      survey:'',
      startedAt:Date.now()
    };

    addEvent('start');
    persist();

  };

  state('동의 전에는 실험 데이터를 수집하지 않습니다.');
}

function warn(message) {
  const e=document.getElementById('warning');
  e.textContent=message;
  e.classList.remove('hidden');
}

function instructions() {
  study.stage='instructions';
  persist();

  display(`
    <h2>실험 방법</h2>

    <p>
      1번부터 20번까지 카드가 한 줄로 놓여 있고,
      그중 한 곳에 목표 카드가 있습니다.
    </p>

    <p>
      각 카드 위의 막대와 백분율은
      <b>그 위치가 목표일 확률</b>입니다.
      원하는 위치를 선택할 수 있습니다.
    </p>

    <p>
      선택하면 목표가 그 위치보다
      <b>왼쪽인지, 오른쪽인지, 정답인지</b>
      알려줍니다.
      가능한 한 적은 횟수로 목표를 찾아주세요.
    </p>

    <p>
      연습 2회를 진행한 다음 본 실험
      20회가 이어집니다. 시간 제한은 없습니다.
    </p>

    <div class="controls">
      <button class="primary" id="startTrials">
        연습 시작
      </button>
      <button class="stop" id="stop">
        참여 중단
      </button>
    </div>
  `);

  document.getElementById('startTrials').onclick=()=>{
    study.stage='trial';

    if(!study.trialStarted) {
      study.trialStarted=Date.now();
      study.previousClick=study.trialStarted;
    }

    persist();
    drawTrial();
  };

  document.getElementById('stop').onclick=withdraw;

  state('진행 중인 응답은 이 브라우저에만 임시 보관됩니다.');
}

function current() {
  return study.trials[study.i];
}

function currentTrialNumber() {
  return study.i-1;
}

function addEvent(kind,extras={}) {
  const t=study.trials[study.i]||null;

  const row={
    event_id:uid(),
    session_id:study.id,
    kind,
    trial_no:t?currentTrialNumber():null,
    condition:t?t.condition:null,
    stimulus_id:t?t.id:null,
    peak_position:t?t.peak:null,
    target_position:t?t.target:null,
    click_index:null,
    click_position:null,
    feedback:null,
    invalid_click:null,
    rt_ms:null,
    total_clicks:null,
    probabilities:null,
    survey_text:null,
    ...extras
  };

  study.events.push(row);
  persist();
}

function drawTrial() {
  if(study.i===22) {
    showSurvey();
    return;
  }

  study.stage='trial';

  const t=current();
  const last=study.clicks.at(-1);
  const finished=last?.feedback==='correct';

  const title=study.i<2
    ?`연습 ${study.i+1}/2`
    :`본 실험 ${study.i-1}/20`;

  const feedback=!last
    ?'어떤 위치부터 확인할지 선택하세요.'
    :last.feedback==='correct'
      ?'정답입니다! 다음 시행으로 넘어갈 수 있습니다.'
      :last.feedback==='right'
        ?'목표 카드는 선택한 위치보다 오른쪽에 있습니다.'
        :'목표 카드는 선택한 위치보다 왼쪽에 있습니다.';

  display(`
    <div class="row between">
      <h2>${title}</h2>
      <strong>목표 카드의 위치를 찾으세요</strong>
    </div>

    <p class="muted">
      카드별 정답 확률 (막대의 공통 범위: 0~20%).
      좁은 화면에서는 좌우로 스크롤할 수 있습니다.
    </p>

    <div class="scroll">
      <div class="bargrid" id="bargrid"></div>
    </div>

    <div class="notice ${finished?'success':''}"
         id="feedback" aria-live="polite">
      ${feedback}
    </div>

    <div class="controls">
      <button id="nextTrial"
              class="primary ${finished?'':'hidden'}">
        다음 시행
      </button>
      <button id="stop" class="stop">
        참여 중단
      </button>
    </div>
  `);

  const grid=document.getElementById('bargrid');

  t.p.forEach((v,index)=>{
    const position=index+1;
    const div=document.createElement('div');
    div.className='cell';

    div.innerHTML=`
      <div class="pct">${(v/10).toFixed(1)}%</div>
      <div class="barbox">
        <div class="bar"
             style="height:${(v/200)*100}%"></div>
      </div>
      <div class="pos">${position}번</div>
    `;

    const button=document.createElement('button');
    button.textContent='확인';

    button.className='pick'+(
      study.clicks.some(c=>c.position===position)
        ?' used':''
    );

    button.disabled=!!finished;
    button.onclick=()=>clickCard(position);

    div.appendChild(button);
    grid.appendChild(div);
  });

  document.getElementById('stop').onclick=withdraw;
  document.getElementById('nextTrial').onclick=nextTrial;

  persist();
  state('진행 중 응답은 Supabase로 전송되지 않습니다.');
}

function clickCard(position) {
  const t=current();

  if(
    !t ||
    study.clicks.some(c=>c.feedback==='correct')
  ) return;

  const now=Date.now();
  let low=1;
  let high=20;

  for(const prev of study.clicks) {
    if(prev.feedback==='right')
      low=Math.max(low,prev.position+1);

    if(prev.feedback==='left')
      high=Math.min(high,prev.position-1);
  }

  const invalid=position<low||position>high;

  const feedback=position===t.target
    ?'correct'
    :position<t.target
      ?'right'
      :'left';

  const clickIndex=study.clicks.length+1;
  const elapsed=now-study.trialStarted;
  const rt=now-study.previousClick;

  study.clicks.push({
    position,feedback,invalid,
    rt_ms:rt,
    elapsed_ms:elapsed
  });

  addEvent('click',{
    click_index:clickIndex,
    click_position:position,
    feedback,
    invalid_click:invalid,
    rt_ms:rt,
    probabilities:t.p
  });

  study.previousClick=now;

  if(feedback==='correct') {
    addEvent('trial_done',{
      total_clicks:clickIndex,
      rt_ms:elapsed
    });
  }

  drawTrial();
}

function nextTrial() {
  if(
    !study.clicks.length ||
    study.clicks.at(-1).feedback!=='correct'
  ) return;

  study.i++;
  study.clicks=[];
  study.trialStarted=Date.now();
  study.previousClick=study.trialStarted;

  persist();
  drawTrial();
}

function showSurvey() {
  study.stage='survey';
  persist();

  display(`
    <h2>실험 종료</h2>

    <p>
      카드 위치를 선택할 때 주로 어떤 기준을
      사용했나요? (선택 사항)
    </p>

    <textarea id="strategy" maxlength="1200"
      placeholder="예: 확률이 큰 카드부터 확인했습니다.">${escapeHtml(study.survey||'')}</textarea>

    <div class="controls">
      <button class="primary" id="submit">
        최종 응답 제출
      </button>
      <button class="stop" id="stop">
        제출하지 않고 중단
      </button>
    </div>

    <p class="muted">
      제출 버튼을 누르면 지금까지의 모든 기록이
      한 번에 저장됩니다.
    </p>
  `);

  document.getElementById('submit').onclick=submitStudy;
  document.getElementById('stop').onclick=withdraw;

  state('아직 데이터는 서버로 전송되지 않았습니다.');
}

function withdraw() {
  if(uploading)return;

  if(!confirm(
    '참여를 중단하고 임시 저장된 응답을 삭제할까요? '+
    '서버로 전송하지 않습니다.'
  ))return;

  clearStudy();

  display(`
    <h2>참여 중단</h2>
    <p>실험 응답을 제출하지 않았습니다.</p>
  `);

  state('서버로 실험 응답을 전송하지 않았습니다.');
}

function submitStudy() {
  if(
    uploading ||
    !study ||
    study.stage!=='survey'
  )return;

  study.survey=
    document.getElementById('strategy').value;

  addEvent('survey',{
    survey_text:study.survey
  });

  study.stage='submitting';
  persist();

  sendSubmission();
}

async function sendSubmission() {
  if(
    uploading ||
    !study ||
    study.stage!=='submitting'
  )return;

  uploading=true;

  display(`
    <h2>자료 제출 중</h2>
    <p>
      전체 실험 기록을 저장하고 있습니다.
      이 창을 닫지 마세요.
    </p>
    <div id="submitError"></div>
  `);

  state('서버에 전체 자료를 일괄 전송 중입니다.');

  try {
    const url=new URL(
      '/rest/v1/rpc/save_psychology_session',
      SUPABASE_URL
    ).href;

    const response=await fetch(url,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_PUBLISHABLE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({p_events:study.events})
    });

    if(!response.ok) {
      const body=await response.text();
      let code='';

      try {
        code=JSON.parse(body).code||'';
      } catch(_) {}

      if(response.status===409&&code==='23505') {
        throw new Error(
          '이미 같은 응답 ID가 저장되어 있습니다. '+
          'Supabase에서 해당 세션의 저장 상태를 확인해 주세요.'
        );
      }

      throw new Error(
        `HTTP ${response.status}: ${body.slice(0,320)}`
      );
    }

    clearStudy();

    display(`
      <h2>제출 완료</h2>
      <p>
        응답이 정상적으로 저장되었습니다.
        참여해 주셔서 감사합니다.
      </p>
    `);

    state('저장 완료');

  } catch(error) {
    const box=document.getElementById('submitError');

    box.innerHTML=`
      <p class="notice error" id="errorText"></p>
      <div class="controls">
        <button id="tryAgain" class="primary">
          저장 재시도
        </button>
      </div>
    `;

    document.getElementById('errorText').textContent=
      String(error.message||error);

    document.getElementById('tryAgain').onclick=
      ()=>sendSubmission();

    state(
      '저장 실패: 기록은 이 브라우저에 남아 있으며 '+
      '재시도할 수 있습니다.'
    );
  } finally {
    uploading=false;
  }
}

function init() {
  try {
    validate();
  } catch(e) {
    display(`
      <div class="notice error">
        실험 자극 검증 오류:
        ${escapeHtml(e.message)}
      </div>
    `);
    return;
  }

  try {
    study=JSON.parse(
      localStorage.getItem(STORAGE_KEY)||'null'
    );
  } catch(_) {
    study=null;
  }

  if(!study) {
    landing();
    return;
  }

  if(study.stage==='instructions') {
    instructions();
    return;
  }

  if(study.stage==='trial') {
    drawTrial();
    return;
  }

  if(study.stage==='survey') {
    showSurvey();
    return;
  }

  if(study.stage==='submitting') {
    display(`
      <h2>이전에 완료한 응답이 제출되지 않았습니다</h2>
      <p>응답을 보내려면 저장 재시도를 눌러 주세요.</p>
      <button class="primary" id="retry">
        저장 재시도
      </button>
    `);

    document.getElementById('retry').onclick=
      sendSubmission;
    return;
  }

  landing();
}

init();
</script>
</body>
</html>
