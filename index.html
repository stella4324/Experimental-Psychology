<!DOCTYPE html>
<html lang="ko"><head>
  <base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정보 탐색 실험</title>
  <style>
    :root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#182b3c;background:#f5f8fa}
    *{box-sizing:border-box}body{margin:0;padding:20px}
    main{max-width:1360px;margin:auto;background:#fff;border:1px solid #dae3eb;border-radius:15px;padding:24px;box-shadow:0 5px 20px #1b344511}
    h1{font-size:24px;margin:0 0 14px}h2{font-size:17px;margin:16px 0 9px}
    p{line-height:1.65}.small{font-size:13px;color:#536777}.hidden{display:none!important}
    label{display:block;margin:12px 0;line-height:1.55}input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px}
    button{border:0;border-radius:8px;padding:10px 15px;background:#17557c;color:white;font-size:15px;cursor:pointer}
    button:disabled{opacity:.48;cursor:default}.danger{background:#865367}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .notice{background:#eff5f8;border-radius:10px;padding:12px 15px;margin:10px 0 13px}.info{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
    .tablewrap{overflow-x:auto;padding-bottom:5px}
    table{width:100%;min-width:1030px;table-layout:fixed;border-collapse:separate;border-spacing:3px}
    td{border:1px solid #d6e1e9;border-radius:7px;text-align:center;padding:6px 2px 8px;vertical-align:bottom}
    .chartcol{height:114px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
    .barbase{height:93px;width:22px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #93a7b8}
    .bar{width:17px;min-height:2px;background:#5280a6;border-radius:3px 3px 0 0;transition:none}
    .prob{font-size:12px;font-weight:700;color:#183d57;white-space:nowrap}
    .slot{font-size:12px;color:#536577;margin:5px 0 6px}
    .choose{width:90%;font-size:12px;padding:7px 1px}
    td.selected{background:#eef4f8;border-color:#6b95af}
    #feedback{font-weight:650;min-height:27px;margin:10px 0 2px}
    .error{color:#b12b44;font-weight:650}.success{color:#176742}
    #syncBanner{font-size:13px;color:#526675;margin-top:12px}
    #retryBtn{font-size:12px;padding:5px 10px;margin-left:8px}
    textarea{width:100%;height:90px;border:1px solid #c8d4dd;border-radius:8px;padding:10px;font:inherit}
  </style>
</head><body><main>
<section id="consentScreen">
  <h1>정보 탐색 실험</h1>
  <p><?= studyText.overview ?></p><p><?= studyText.duration ?></p>
  <p><?= studyText.voluntary ?></p><p><?= studyText.privacy ?></p>
  <p><b>연구자 문의</b>: <?= studyText.contact ?></p>
  <label><input id="adult" type="checkbox">만 18세 이상입니다.</label>
  <label><input id="agree" type="checkbox">연구 설명을 읽고 이해했으며, 자발적으로 참여에 동의합니다.</label>
  <div class="actions"><button id="startBtn">동의하고 시작</button></div>
</section>
<section id="instructionScreen" class="hidden">
  <h1>실험 방법</h1>
  <p><?= studyText.instruction_one ?></p><p><?= studyText.instruction_two ?></p>
  <p><?= studyText.instruction_three ?></p><p><?= studyText.instruction_four ?></p>
  <div class="actions"><button id="toTrialBtn">연습 시작</button><button class="danger" id="quit1">참여 중단</button></div>
</section>
<section id="trialScreen" class="hidden">
  <div class="info"><h1 id="trialHeading">탐색 과제</h1><span class="small" id="progress"></span></div>
  <div class="notice">위치별 확률의 막대 높이와 숫자(%)를 참고하여 원하는 카드를 선택하세요. 모든 위치는 계속 선택할 수 있습니다.</div>
  <h2>목표 숫자: <span id="targetNumber"></span></h2>
  <div class="tablewrap"><table aria-label="1번부터 20번까지의 위치, 정답 확률 막대그래프 및 선택 버튼"><tbody id="slotTable"></tbody></table></div>
  <div id="feedback" aria-live="polite">원하는 위치를 클릭하세요.</div>
  <div class="actions"><button id="nextBtn" class="hidden">다음 시행</button><button class="danger" id="quit2">참여 중단</button></div>
  <p class="small">위치 번호는 왼쪽에서 오른쪽으로 1~20번입니다. 모든 막대는 동일한 세로 기준(0~22%)으로 표시됩니다.</p>
</section>
<section id="surveyScreen" class="hidden">
  <h1>실험 완료</h1><p><?= studyText.survey_question ?></p>
  <textarea id="surveyText" placeholder="선택 사항"></textarea>
  <div class="actions"><button id="saveSurveyBtn">제출하고 종료</button></div>
</section>
<section id="doneScreen" class="hidden"><h1>참여해 주셔서 감사합니다.</h1><p id="doneMessage"></p></section>
<div id="syncBanner" aria-live="polite"></div><button id="retryBtn" class="hidden">저장 재시도</button>
<div id="errorText" class="error" aria-live="polite"></div>
</main><script>
'use strict';
// Fast browsing UX: the complete target plan is obtained once at entry.
// Clicks and screen transitions are instantaneous; completed trials are
// queued and saved to Sheets in the background, one trial per server call.
// Do not use this for high-security testing: a technical participant could
// inspect the browser state for the target positions. Server validates uploads.
const KEY='ordered_search_20_fast_progress_v1';
const $=id=>document.getElementById(id);
const SCREENS=['consentScreen','instructionScreen','trialScreen','surveyScreen','doneScreen'];
let sid=null, bundle=null, cursor=0, clicks=[], pending=[], selected=[], trialFinished=false;
let saving=false, saveError=false, quitting=false, surveyRequested=false, surveySending=false;
let lastActionTime=performance.now();

function show(id){SCREENS.forEach(x=>$(x).classList.toggle('hidden',id!==x));$('errorText').textContent='';}
function report(message){$('errorText').textContent=message;}
function persist(){
  if(!sid)return;
  sessionStorage.setItem(KEY,JSON.stringify({sid,cursor,clicks,pending,trialFinished}));
}
function clearLocal(){sessionStorage.removeItem(KEY);}
function status(){
  const n=pending.length;
  $('retryBtn').classList.toggle('hidden',!saveError);
  $('syncBanner').textContent=saveError?'저장 연결 오류: 저장 재시도를 눌러주세요. 진행 중인 기록은 이 탭에 임시 보관됩니다.':
    n>0?`기록 ${n}개 시행을 저장 중입니다. 완료 전에는 창을 닫지 마세요.`:'기록 저장 상태: 정상';
}
function feedbackText(k,t){
  if(k===t)return '정답입니다!';
  return k<t?`${k}번 카드보다 목표 숫자가 큽니다. (오른쪽)`:`${k}번 카드보다 목표 숫자가 작습니다. (왼쪽)`;
}
function current(){return bundle&&bundle.trials[cursor];}
function showTrial(resume=false){
  if(!bundle)return;
  if(cursor>=bundle.trials.length){show('surveyScreen');status();return;}
  const tr=current();
  $('trialHeading').textContent=tr.phase==='practice'?'연습 시행':'본 실험';
  $('progress').textContent=tr.phase==='practice'?`연습 ${cursor+1}/2`:`본 실험 ${cursor-1}/20`;
  $('targetNumber').textContent=String(tr.target_number);
  $('nextBtn').classList.toggle('hidden',!trialFinished);
  if(!resume){clicks=[];trialFinished=false;selected=[];$('nextBtn').classList.add('hidden');}
  else{
    const source=trialFinished?(pending.find(r=>r.trialNumber===tr.trial_number)||{}).clicks||[]:clicks;
    selected=source.map(c=>c.position);
  }
  const row=document.createElement('tr');
  tr.probabilities_percent.forEach((prob,i)=>{
    const td=document.createElement('td');td.classList.toggle('selected',selected.includes(i+1));
    const chart=document.createElement('div');chart.className='chartcol';
    const num=document.createElement('div');num.className='prob';num.textContent=Number(prob).toFixed(1)+'%';
    const base=document.createElement('div');base.className='barbase';
    const bar=document.createElement('div');bar.className='bar';bar.style.height=Math.min(93,93*Number(prob)/22)+'px';
    base.appendChild(bar);chart.append(num,base);
    const label=document.createElement('div');label.className='slot';label.textContent=(i+1)+'번';
    const b=document.createElement('button');b.className='choose';b.textContent='확인';b.disabled=trialFinished||quitting;
    b.setAttribute('aria-label',`${i+1}번 카드, 정답 확률 ${Number(prob).toFixed(1)}퍼센트`);
    b.onclick=()=>clickCard(i+1);
    td.append(chart,label,b);row.appendChild(td);
  });
  const tb=$('slotTable');tb.replaceChildren(row);
  $('feedback').textContent=selected.length?feedbackText(selected[selected.length-1],tr.target_position):'원하는 위치를 클릭하세요.';
  show('trialScreen');status();lastActionTime=performance.now();
}
function clickCard(k){
  if(trialFinished||quitting||!current())return;
  const tr=current();
  let lo=1,hi=20;
  clicks.forEach(c=>{if(c.position>=lo&&c.position<=hi){if(c.position<tr.target_position)lo=c.position+1;else if(c.position>tr.target_position)hi=c.position-1;}});
  const rt=Math.round(performance.now()-lastActionTime);
  clicks.push({position:k,rt_ms:Math.max(0,rt)});
  selected.push(k);
  const incorrect=k<lo||k>hi;
  $('feedback').textContent=feedbackText(k,tr.target_position)+(incorrect?' (이전 결과로 제외된 위치)':'');
  Array.from($('slotTable').querySelectorAll('td')).forEach((td,i)=>td.classList.toggle('selected',selected.includes(i+1)));
  if(k===tr.target_position){
    trialFinished=true;
    pending.push({trialNumber:tr.trial_number,clicks:clicks.slice()});
    clicks=[];
    $('nextBtn').classList.remove('hidden');
    $('slotTable').querySelectorAll('button.choose').forEach(b=>b.disabled=true);
    persist();flushQueue();
  }else persist();
  lastActionTime=performance.now();
}
function nextTrial(){
  if(!trialFinished||quitting)return;
  cursor++;trialFinished=false;clicks=[];selected=[];
  persist();showTrial(false);
}
function flushQueue(){
  status();if(!sid||saving||saveError||pending.length===0){afterDrain();return;}
  const item=pending[0];saving=true;
  google.script.run.withSuccessHandler(()=>{
    saving=false;pending.shift();persist();status();flushQueue();
  }).withFailureHandler(e=>{
    saving=false;saveError=true;status();report('저장 실패: '+(e&&e.message||e)+'. 저장 재시도를 눌러주세요.');
  }).saveTrialBatch(sid,item.trialNumber,item.clicks);
}
function afterDrain(){
  if(saving||pending.length||saveError)return;
  if(quitting)finishQuit();else if(surveyRequested)finishSurvey();
}
function retry(){saveError=false;report('');flushQueue();}
function finishQuit(){
  // Previous completed trials are synced first; this saves current partial clicks.
  const partialNumber=cursor+1, partial=trialFinished?[]:clicks.slice();
  google.script.run.withSuccessHandler(()=>{
    quitting=false;clearLocal();$('doneMessage').textContent='참여가 중단되었습니다. 이전까지 저장된 응답은 수업 과제에 이용될 수 있습니다.';show('doneScreen');status();
  }).withFailureHandler(e=>{quitting=false;saveError=false;$('quit1').disabled=false;$('quit2').disabled=false;$('nextBtn').disabled=false;status();report('중단 기록 저장 오류: '+(e&&e.message||e)+'. 다시 참여 중단을 눌러주세요.');}).quitSession(sid,partialNumber,partial);
}
function quit(){
  if(!sid){$('doneMessage').textContent='참여하지 않기로 선택하셨습니다.';show('doneScreen');return;}
  if(quitting)return;
  quitting=true;report('');$('quit1').disabled=true;$('quit2').disabled=true;
  $('slotTable').querySelectorAll('button.choose').forEach(b=>b.disabled=true);
  $('nextBtn').disabled=true;
  $('syncBanner').textContent='진행 기록을 저장하고 참여를 종료하는 중입니다.';
  if(!pending.length&&!saving&&!saveError)finishQuit();else flushQueue();
}
function finishSurvey(){
  if(surveySending)return;
  surveySending=true;
  google.script.run.withSuccessHandler(()=>{
    surveySending=false;clearLocal();$('doneMessage').textContent='응답이 정상적으로 저장되었습니다.';show('doneScreen');status();
  }).withFailureHandler(e=>{surveySending=false;surveyRequested=false;$('saveSurveyBtn').disabled=false;report('마지막 응답 저장 실패: '+(e&&e.message||e)+'. 다시 제출해 주세요.');}).saveSurvey(sid,$('surveyText').value);
}
function submitSurvey(){
  if(!bundle||surveySending)return;
  surveyRequested=true;report('');$('saveSurveyBtn').disabled=true;
  if(saveError){report('먼저 저장 재시도를 눌러주세요.');$('saveSurveyBtn').disabled=false;return;}
  if(pending.length||saving){$('syncBanner').textContent='기록 저장이 끝나면 자동으로 종료됩니다.';flushQueue();}
  else finishSurvey();
}
function useBundle(data,resume=false){
  sid=data.session_id||sid;bundle=data;
  if(data.status==='withdrawn'){$('doneMessage').textContent='이미 중단된 참여입니다.';clearLocal();show('doneScreen');return;}
  const locRaw=sessionStorage.getItem(KEY);
  let local={};try{local=JSON.parse(locRaw||'{}')||{};}catch(e){}
  if(resume&&local.sid===sid){
    cursor=Math.max(data.saved_count,Number(local.cursor)||0);
    pending=(local.pending||[]).filter(a=>a.trialNumber>data.saved_count);
    clicks=local.clicks||[];trialFinished=!!local.trialFinished;
    if(cursor>data.saved_count&&pending.length===0){
      // Previous upload may have been acknowledged just before refresh. Reload safely.
      cursor=data.saved_count;clicks=[];trialFinished=false;
    }
    show('instructionScreen');$('toTrialBtn').textContent='이어서 진행';
  }else{cursor=data.saved_count||0;pending=[];clicks=[];trialFinished=false;show('instructionScreen');}
  if(data.status==='complete'){cursor=data.trials.length;show('surveyScreen');}
  persist();status();flushQueue();
}
function start(){
  if(!$('adult').checked||!$('agree').checked){report('성인 여부와 참여 동의를 모두 확인해 주세요.');return;}
  $('startBtn').disabled=true;
  google.script.run.withSuccessHandler(data=>{
    $('startBtn').disabled=false;useBundle(data,false);
  }).withFailureHandler(e=>{$('startBtn').disabled=false;report('시작 오류: '+(e&&e.message||e));}).startSession(true,true);
}
$('startBtn').onclick=start;
$('toTrialBtn').onclick=()=>showTrial(true);
$('nextBtn').onclick=nextTrial;
$('quit1').onclick=quit;$('quit2').onclick=quit;
$('saveSurveyBtn').onclick=submitSurvey;$('retryBtn').onclick=retry;
const saved=sessionStorage.getItem(KEY);
if(saved){
  let local=null;try{local=JSON.parse(saved);}catch(e){}
  if(local&&local.sid){
    sid=local.sid;show('instructionScreen');$('toTrialBtn').disabled=true;
    google.script.run.withSuccessHandler(data=>{
      $('toTrialBtn').disabled=false;useBundle(data,true);
    }).withFailureHandler(e=>{
      $('toTrialBtn').disabled=false;report('재접속 오류: '+(e&&e.message||e));
    }).getSessionBundle(sid);
  }
}
// A tab close cannot reliably upload a partial trial. Local sessionStorage keeps
// the queued data for this tab if the user returns; explicit withdrawal syncs it.
window.addEventListener('beforeunload',e=>{
  if(sid&&(pending.length||clicks.length||saving)){
    e.preventDefault();e.returnValue='';
  }
});
</script></body></html>
